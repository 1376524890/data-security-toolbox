server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 2048m;
  client_body_timeout 1800s;
  # Docker service IPs can change after a backend restart.  Resolve the
  # service name through Docker DNS for every upstream refresh instead of
  # pinning the address that existed when nginx started.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $backend_upstream http://backend:8000;
  location = /api/v1/rules/sync {
    proxy_pass $backend_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 900s;
  }
  location = /api/v1/pcaps/upload {
    proxy_pass $backend_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_read_timeout 1800s;
    proxy_send_timeout 1800s;
  }
  location /api/ {
    proxy_pass $backend_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 180s;
  }
  location / {
    try_files $uri $uri/ /index.html;
  }
}
