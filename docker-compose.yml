# Persistent state (Postgres, Redis, storage/reports) is bind-mounted under
# ${DATA_ROOT:-./deploy-data} so rebuilding images or recreating containers never
# touches it and the whole data set can be copied as a plain directory. When
# switching from the previous named volumes, migrate once (see docs/部署与运行手册.md).
services:
  postgres:
    image: postgres:16.6-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-security_toolbox}
      POSTGRES_USER: ${POSTGRES_USER:-security}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - ${DATA_ROOT:-./deploy-data}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-security} -d ${POSTGRES_DB:-security_toolbox}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    # never = a fully offline stack must fail fast instead of reaching a registry.
    pull_policy: ${PULL_POLICY:-missing}

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ${DATA_ROOT:-./deploy-data}/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    # never = a fully offline stack must fail fast instead of reaching a registry.
    pull_policy: ${PULL_POLICY:-missing}

  backend:
    image: ${BACKEND_IMAGE:-source-backend:latest}
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: api
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      APP_ENV: ${APP_ENV:-production}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
      PROBE_BOOTSTRAP_TOKEN: ${PROBE_BOOTSTRAP_TOKEN:?PROBE_BOOTSTRAP_TOKEN is required}
      DEPLOYMENT_SECRET_KEY: ${DEPLOYMENT_SECRET_KEY:-}
      DEPLOYMENT_PACKAGE_DIR: /app/probe_packages
      DEPLOYMENT_BACKEND_URL: ${DEPLOYMENT_BACKEND_URL:-}
      DEPLOYMENT_CA_FILE: ${DEPLOYMENT_CA_FILE:-}
      DEPLOYMENT_KNOWN_HOSTS: ${DEPLOYMENT_KNOWN_HOSTS:-}
      DEPLOYMENT_VERIFY_HOST_KEY: ${DEPLOYMENT_VERIFY_HOST_KEY:-true}
      PROBE_AGENT_VERSION: ${PROBE_AGENT_VERSION:-3.7.0}
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-security}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-security_toolbox}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      STORAGE_DIR: /app/data/storage
      REPORT_DIR: /app/data/reports
      EXTERNAL_ENGINE_DIR: /app/data/external
      INTEGRATION_DIR: /app/data/integrations
      OFFLINE_DIR: /app/app/integrations/offline_data
      PRESIDIO_ENABLED: "false"
      DLP_IGNORE_OWN_TRAFFIC: ${DLP_IGNORE_OWN_TRAFFIC:-true}
      DLP_SELF_ENDPOINTS: ${DLP_SELF_ENDPOINTS:-}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-2048}
      PCAP_INDEX_LIMIT: ${PCAP_INDEX_LIMIT:-10000}
      PCAP_RETENTION_DAYS: ${PCAP_RETENTION_DAYS:-7}
      PCAP_STORAGE_MAX_GB: ${PCAP_STORAGE_MAX_GB:-100}
      QUEUE_PENDING_MAX: ${QUEUE_PENDING_MAX:-200}
      QUEUE_OLDEST_PENDING_SECONDS: ${QUEUE_OLDEST_PENDING_SECONDS:-900}
      ALERT_SUPPRESS_WINDOW_SECONDS: ${ALERT_SUPPRESS_WINDOW_SECONDS:-300}
      WEBHOOK_URL: ${WEBHOOK_URL:-}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_TO: ${SMTP_TO:-}
      MISP_URL: ${MISP_URL:-}
      MISP_API_KEY: ${MISP_API_KEY:-}
      URLHAUS_AUTH_KEY: ${URLHAUS_AUTH_KEY:-}
      CUSTOM_INTEL_URL: ${CUSTOM_INTEL_URL:-}
      CUSTOM_INTEL_TOKEN: ${CUSTOM_INTEL_TOKEN:-}
      WAZUH_URL: ${WAZUH_URL:-}
      WAZUH_USER: ${WAZUH_USER:-}
      WAZUH_PASSWORD: ${WAZUH_PASSWORD:-}
      WAZUH_VERIFY_TLS: ${WAZUH_VERIFY_TLS:-true}
      WAZUH_POLL_SECONDS: ${WAZUH_POLL_SECONDS:-60}
      WAZUH_ALERT_LIMIT: ${WAZUH_ALERT_LIMIT:-200}
      OSQUERY_SOCKET: ${OSQUERY_SOCKET:-}
      # Manual test-pack import. Off by default; APP_ENV=production refuses it.
      TEST_DATA_IMPORT_ENABLED: ${TEST_DATA_IMPORT_ENABLED:-false}
      COOKIE_SECURE: "false"
    volumes:
      - ${DATA_ROOT:-./deploy-data}/backend:/app/data
      - ./data_security_toolbox_manual_testpack:/app/data_security_toolbox_manual_testpack:ro
      - ./probe_packages:/app/probe_packages:ro
      - ./.local/deployment:/app/deployment:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      # /health is deliberately thorough (Celery control-bus queue depth alone
      # takes ~2s, and rule counts + probe histogram add a few more), so a 5s
      # timeout reported the container unhealthy while the endpoint was fine.
      interval: 30s
      timeout: 20s
      retries: 10
    restart: unless-stopped
    # never = a fully offline stack must fail fast instead of reaching a registry.
    pull_policy: ${PULL_POLICY:-missing}

  worker:
    image: ${WORKER_IMAGE:-source-worker:latest}
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: analysis-worker
    command: ["celery", "-A", "app.workers.celery_app.celery_app", "worker", "--loglevel=info", "--concurrency=2"]
    healthcheck:
      test: ["CMD", "python", "-c", "import celery; print('ok')"]
      interval: 15s
      timeout: 5s
      retries: 10
    environment:
      APP_ENV: ${APP_ENV:-production}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
      PROBE_BOOTSTRAP_TOKEN: ${PROBE_BOOTSTRAP_TOKEN:?PROBE_BOOTSTRAP_TOKEN is required}
      DEPLOYMENT_SECRET_KEY: ${DEPLOYMENT_SECRET_KEY:-}
      DEPLOYMENT_PACKAGE_DIR: /app/probe_packages
      DEPLOYMENT_BACKEND_URL: ${DEPLOYMENT_BACKEND_URL:-}
      DEPLOYMENT_CA_FILE: ${DEPLOYMENT_CA_FILE:-}
      DEPLOYMENT_KNOWN_HOSTS: ${DEPLOYMENT_KNOWN_HOSTS:-}
      DEPLOYMENT_VERIFY_HOST_KEY: ${DEPLOYMENT_VERIFY_HOST_KEY:-true}
      PROBE_AGENT_VERSION: ${PROBE_AGENT_VERSION:-3.7.0}
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-security}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-security_toolbox}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      STORAGE_DIR: /app/data/storage
      REPORT_DIR: /app/data/reports
      EXTERNAL_ENGINE_DIR: /app/data/external
      INTEGRATION_DIR: /app/data/integrations
      OFFLINE_DIR: /app/app/integrations/offline_data
      PRESIDIO_ENABLED: "false"
      DLP_IGNORE_OWN_TRAFFIC: ${DLP_IGNORE_OWN_TRAFFIC:-true}
      DLP_SELF_ENDPOINTS: ${DLP_SELF_ENDPOINTS:-}
      MISP_URL: ${MISP_URL:-}
      MISP_API_KEY: ${MISP_API_KEY:-}
      URLHAUS_AUTH_KEY: ${URLHAUS_AUTH_KEY:-}
      CUSTOM_INTEL_URL: ${CUSTOM_INTEL_URL:-}
      CUSTOM_INTEL_TOKEN: ${CUSTOM_INTEL_TOKEN:-}
      WAZUH_URL: ${WAZUH_URL:-}
      WAZUH_USER: ${WAZUH_USER:-}
      WAZUH_PASSWORD: ${WAZUH_PASSWORD:-}
      WAZUH_VERIFY_TLS: ${WAZUH_VERIFY_TLS:-true}
      WAZUH_POLL_SECONDS: ${WAZUH_POLL_SECONDS:-60}
      WAZUH_ALERT_LIMIT: ${WAZUH_ALERT_LIMIT:-200}
      OSQUERY_SOCKET: ${OSQUERY_SOCKET:-}
      WEBHOOK_URL: ${WEBHOOK_URL:-}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_TO: ${SMTP_TO:-}
    volumes:
      - ${DATA_ROOT:-./deploy-data}/backend:/app/data
      - ./probe_packages:/app/probe_packages:ro
      - ./.local/deployment:/app/deployment:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    # never = a fully offline stack must fail fast instead of reaching a registry.
    pull_policy: ${PULL_POLICY:-missing}

  beat:
    # Same image the worker builds - no second (third) compilation of it.
    image: ${WORKER_IMAGE:-source-worker:latest}
    command: ["celery", "-A", "app.workers.celery_app.celery_app", "beat", "--loglevel=info"]
    environment:
      APP_ENV: ${APP_ENV:-production}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
      PROBE_BOOTSTRAP_TOKEN: ${PROBE_BOOTSTRAP_TOKEN:?PROBE_BOOTSTRAP_TOKEN is required}
      DEPLOYMENT_SECRET_KEY: ${DEPLOYMENT_SECRET_KEY:-}
      DEPLOYMENT_PACKAGE_DIR: /app/probe_packages
      DEPLOYMENT_BACKEND_URL: ${DEPLOYMENT_BACKEND_URL:-}
      DEPLOYMENT_CA_FILE: ${DEPLOYMENT_CA_FILE:-}
      DEPLOYMENT_KNOWN_HOSTS: ${DEPLOYMENT_KNOWN_HOSTS:-}
      DEPLOYMENT_VERIFY_HOST_KEY: ${DEPLOYMENT_VERIFY_HOST_KEY:-true}
      PROBE_AGENT_VERSION: ${PROBE_AGENT_VERSION:-3.7.0}
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-security}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-security_toolbox}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      STORAGE_DIR: /app/data/storage
      REPORT_DIR: /app/data/reports
      EXTERNAL_ENGINE_DIR: /app/data/external
      INTEGRATION_DIR: /app/data/integrations
      OFFLINE_DIR: /app/app/integrations/offline_data
      PRESIDIO_ENABLED: "false"
      DLP_IGNORE_OWN_TRAFFIC: ${DLP_IGNORE_OWN_TRAFFIC:-true}
      DLP_SELF_ENDPOINTS: ${DLP_SELF_ENDPOINTS:-}
      PCAP_RETENTION_DAYS: ${PCAP_RETENTION_DAYS:-7}
    volumes:
      - ${DATA_ROOT:-./deploy-data}/backend:/app/data
      - ./probe_packages:/app/probe_packages:ro
      - ./.local/deployment:/app/deployment:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    # never = a fully offline stack must fail fast instead of reaching a registry.
    pull_policy: ${PULL_POLICY:-missing}

  deployment-worker:
    # Same image the worker builds - no second (third) compilation of it.
    image: ${WORKER_IMAGE:-source-worker:latest}
    command: ["celery", "-A", "app.workers.celery_app.celery_app", "worker", "--loglevel=info", "-Q", "deployment", "--concurrency=2"]
    environment:
      APP_ENV: ${APP_ENV:-production}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
      PROBE_BOOTSTRAP_TOKEN: ${PROBE_BOOTSTRAP_TOKEN:?PROBE_BOOTSTRAP_TOKEN is required}
      DEPLOYMENT_SECRET_KEY: ${DEPLOYMENT_SECRET_KEY:?DEPLOYMENT_SECRET_KEY is required}
      DEPLOYMENT_PACKAGE_DIR: /app/probe_packages
      DEPLOYMENT_BACKEND_URL: ${DEPLOYMENT_BACKEND_URL:-}
      DEPLOYMENT_CA_FILE: ${DEPLOYMENT_CA_FILE:-}
      DEPLOYMENT_KNOWN_HOSTS: ${DEPLOYMENT_KNOWN_HOSTS:-}
      DEPLOYMENT_VERIFY_HOST_KEY: ${DEPLOYMENT_VERIFY_HOST_KEY:-true}
      PROBE_AGENT_VERSION: ${PROBE_AGENT_VERSION:-3.7.0}
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-security}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-security_toolbox}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      STORAGE_DIR: /app/data/storage
      REPORT_DIR: /app/data/reports
      EXTERNAL_ENGINE_DIR: /app/data/external
      INTEGRATION_DIR: /app/data/integrations
      OFFLINE_DIR: /app/app/integrations/offline_data
      PRESIDIO_ENABLED: "false"
      DLP_IGNORE_OWN_TRAFFIC: ${DLP_IGNORE_OWN_TRAFFIC:-true}
      DLP_SELF_ENDPOINTS: ${DLP_SELF_ENDPOINTS:-}
    volumes:
      - ${DATA_ROOT:-./deploy-data}/backend:/app/data
      - ./probe_packages:/app/probe_packages:ro
      - ./.local/deployment:/app/deployment:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    # never = a fully offline stack must fail fast instead of reaching a registry.
    pull_policy: ${PULL_POLICY:-missing}

  frontend:
    image: ${FRONTEND_IMAGE:-source-frontend:latest}
    build:
      context: ./frontend
    ports:
      - "${HTTP_PORT:-8080}:80"
    depends_on:
      - backend
    restart: unless-stopped
    # never = a fully offline stack must fail fast instead of reaching a registry.
    pull_policy: ${PULL_POLICY:-missing}

  flower:
    image: mher/flower:2.0.1
    command: ["celery", "flower", "--broker=redis://redis:6379/1", "--port=5555"]
    expose:
      - "5555"
    depends_on:
      - redis
    restart: unless-stopped
    # never = a fully offline stack must fail fast instead of reaching a registry.
    pull_policy: ${PULL_POLICY:-missing}
