services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-security_toolbox}
      POSTGRES_USER: ${POSTGRES_USER:-security}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-security}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-security} -d ${POSTGRES_DB:-security_toolbox}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-security}:${POSTGRES_PASSWORD:-security}@postgres:5432/${POSTGRES_DB:-security_toolbox}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      STORAGE_DIR: /app/data/storage
      REPORT_DIR: /app/data/reports
      EXTERNAL_ENGINE_DIR: /app/data/external
      INTEGRATION_DIR: /app/data/integrations
      OFFLINE_DIR: /app/app/integrations/offline_data
      MISP_URL: ${MISP_URL:-}
      MISP_API_KEY: ${MISP_API_KEY:-}
      WAZUH_URL: ${WAZUH_URL:-}
      OSQUERY_SOCKET: ${OSQUERY_SOCKET:-}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-2048}
      PROBE_TOKEN: ${PROBE_TOKEN:-}
      SECRET_KEY: ${SECRET_KEY:-}
    volumes:
      - backend_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  worker:
    build:
      context: ./backend
    command: ["celery", "-A", "app.workers.celery_app.celery_app", "worker", "--loglevel=info", "--concurrency=2"]
    healthcheck:
      test: ["CMD", "python", "-c", "import celery; print('ok')"]
      interval: 15s
      timeout: 5s
      retries: 10
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-security}:${POSTGRES_PASSWORD:-security}@postgres:5432/${POSTGRES_DB:-security_toolbox}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      STORAGE_DIR: /app/data/storage
      REPORT_DIR: /app/data/reports
      EXTERNAL_ENGINE_DIR: /app/data/external
      INTEGRATION_DIR: /app/data/integrations
      OFFLINE_DIR: /app/app/integrations/offline_data
      MISP_URL: ${MISP_URL:-}
      MISP_API_KEY: ${MISP_API_KEY:-}
      WAZUH_URL: ${WAZUH_URL:-}
      OSQUERY_SOCKET: ${OSQUERY_SOCKET:-}
    volumes:
      - backend_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

  flower:
    image: mher/flower:2.0
    command: ["celery", "flower", "--broker=redis://redis:6379/1", "--port=5555"]
    ports:
      - "5555:5555"
    depends_on:
      - redis
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  backend_data:
