# ============================================================================
#  数据安全工具箱 —— 部署参数（**全部参数都在这个文件里**）
#
#  用法：
#     ./deploy.sh                 # 按本文件部署（一键跑完：载入镜像 → 生成 .env → 起容器 → 等健康）
#     ./deploy.sh --force         # 重新生成 .env（口令全部重建，仅首次部署或确认要换钥时用）
#     ./deploy.sh --dry-run       # 只看会写入的 .env 和将执行的命令，不动系统
#     ./deploy.sh --help          # 查看可用的命令行覆盖项
#
#  规则：
#     * 本文件是唯一配置入口；根目录的 .env 是**生成物**，改参数请改这里（或命令行覆盖）。
#     * 取值 `auto` 表示"首次生成、以后沿用"（口令/密钥用它就不会每次部署都换掉）。
#     * 命令行 > 本文件 > 内置默认值。
#     * 与 compose 无关的说明写在每段注释里。
# ============================================================================

# ---------------------------------------------------------------- 部署位置
PROJECT=source                  # compose 项目名，容器名形如 source-backend-1
DATA_ROOT=./deploy-data         # 数据目录（PG/Redis/上报文件/报告）。**不要指向一个空的旧目录**
PULL_POLICY=never               # never = 离线部署必须失败得快，缺镜像直接报错而不去 registry 拉

# ---------------------------------------------------------------- 端口
HTTP_PORT=8080                  # 控制台（nginx）
API_PORT=8000                   # API / 探针接入

# ---------------------------------------------------------------- 数据库
POSTGRES_DB=security_toolbox
POSTGRES_USER=security
POSTGRES_PASSWORD=auto          # auto = 32 位随机

# ---------------------------------------------------------------- 平台凭据
SECRET_KEY=auto                 # auto = 48 位随机（会话/签名）
ADMIN_USERNAME=admin
ADMIN_PASSWORD=auto             # auto = 20 位随机；部署结束会打印出来
PROBE_BOOTSTRAP_TOKEN=auto      # auto = 40 位随机（探针注册）
DEPLOYMENT_SECRET_KEY=auto      # auto = 48 位随机。**生成后不可更换**，换了已存凭据全部失效

# ---------------------------------------------------------------- 探针下发
DEPLOYMENT_BACKEND_URL=auto     # auto = http://<本机IP>:<API_PORT>；探针必须能访问到这个地址
DEPLOYMENT_CA_FILE=             # 平台用 HTTPS 自签证书时填 CA 路径（容器内路径），否则留空
DEPLOYMENT_KNOWN_HOSTS=         # 目标机 host key 白名单文件（可留空）
DEPLOYMENT_VERIFY_HOST_KEY=true # 严格校验目标机 host key；确定要放宽才改 false
PROBE_AGENT_VERSION=3.7.0       # 随包分发的探针版本（probe_packages/ 里就是它）

# ---------------------------------------------------------------- 采集与存储
MAX_UPLOAD_MB=2048              # 单次上传上限（PCAP / 文件包）
PCAP_INDEX_LIMIT=10000          # 单个 PCAP 最多建索引的包数
PCAP_RETENTION_DAYS=7           # PCAP 保留天数
PCAP_STORAGE_MAX_GB=100         # PCAP 存储上限，超出按保留策略清理
QUEUE_PENDING_MAX=200           # 队列积压告警阈值（条）
QUEUE_OLDEST_PENDING_SECONDS=900 # 最老待处理任务超过这个秒数就告警
ALERT_SUPPRESS_WINDOW_SECONDS=300 # 同一告警的抑制窗口

# ---------------------------------------------------------------- 数据防泄漏（DLP）
DLP_IGNORE_OWN_TRAFFIC=true     # 不把平台自身流量当外传（强烈建议保持 true）
DLP_SELF_ENDPOINTS=auto         # auto = <HTTP_PORT>,<API_PORT>,5432,6379,5555；也可以写 host/CIDR

# ---------------------------------------------------------------- 通知（可选）
WEBHOOK_URL=                    # 告警外发 webhook（留空 = 关闭）
WEBHOOK_SECRET=
SMTP_HOST=                      # 邮件通知（全部留空 = 关闭）
SMTP_PORT=587
SMTP_USER=
SMTP_PASSWORD=
SMTP_FROM=
SMTP_TO=

# ---------------------------------------------------------------- 威胁情报（可选，留空 = 关闭）
URLHAUS_AUTH_KEY=
CUSTOM_INTEL_URL=
CUSTOM_INTEL_TOKEN=
MISP_URL=
MISP_API_KEY=

# ---------------------------------------------------------------- 主机审计集成（可选，留空 = 关闭）
WAZUH_URL=
WAZUH_USER=
WAZUH_PASSWORD=
WAZUH_VERIFY_TLS=true
WAZUH_POLL_SECONDS=60
WAZUH_ALERT_LIMIT=200
OSQUERY_SOCKET=

# ---------------------------------------------------------------- 运行环境
APP_ENV=production              # production 时 /test/import 一律拒绝（交付环境必须是这个）
TEST_DATA_IMPORT_ENABLED=false  # 手工测试数据导入开关，交付环境保持 false
# 说明：COOKIE_SECURE 目前由 docker-compose.yml 固定为 false（HTTP 部署）。上 HTTPS 时改 compose 文件。

# ---------------------------------------------------------------- 漏洞扫描（容器内已有 nuclei）
NUCLEI_BIN=nuclei
NUCLEI_TEMPLATES_DIR=/app/data/nuclei-templates

# ---------------------------------------------------------------- 镜像标签（离线包已带，一般不用改）
BACKEND_IMAGE=source-backend:latest
WORKER_IMAGE=source-worker:latest
FRONTEND_IMAGE=source-frontend:latest
