services:
  wazuh:
    image: wazuh/wazuh-manager:4.9.2
    platform: linux/amd64
    profiles: ["integrations"]
    restart: unless-stopped

  misp:
    image: harvarditsecurity/misp:2.4.198
    platform: linux/amd64
    profiles: ["integrations"]
    environment:
      MISP_ADMIN_EMAIL: admin@localhost
      MISP_ADMIN_PASSWD: ${MISP_ADMIN_PASSWD:?MISP_ADMIN_PASSWD is required}
    volumes:
      - misp_data:/var/www/MISP
    restart: unless-stopped

volumes:
  misp_data:
